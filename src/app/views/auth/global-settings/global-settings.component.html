<app-auth-wrapper
  title="{{ 'general.settings' | transloco}}"
  subTitle="{{ 'general.global' | transloco }}">
  <div class="content-global-settings-block" content-body>
    <div class="content-global-settings-block__min"></div>
    <div class="content-global-settings-block__edit">
      <div class="content-global-settings-block__edit__el">
        <label for="select-theme">{{
          "settings.select-theme" | transloco
        }}</label>
        <select
          id="select-theme"
          name="select-theme"
          (change)="selectTheme($event)"
        >
          <option value="">
            {{ "settings.default-theme" | transloco }}
          </option>
          <option value="light">
            {{ "settings.theme-light" | transloco }}
          </option>
          <option value="dark">
            {{ "settings.theme-dark" | transloco }}
          </option>
        </select>
      </div>
    </div>
  </div>
</app-auth-wrapper>
