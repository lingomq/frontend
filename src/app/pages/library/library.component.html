<app-empty-header></app-empty-header>
<div class="content">
  <div class="content-title">
    <h1>{{ "library.title" | transloco }}</h1>
    <p>{{ "library."+wordType | transloco }} </p>
  </div>
  <div class="content-library-block">
    <div class="content-library-filter">
      <div class="content-library-filter-item">
        <label>{{ "lib.native" | transloco }}</label>
        <select>
          <option>Russian</option>
          <option>English</option>
          <option>German</option>
          <option>French</option>
        </select>
      </div>
      <div class="content-library-filter-item">
        <label>{{ "lib.source" | transloco }}</label>
        <select>
          <option>Russian</option>
          <option>English</option>
          <option>German</option>
          <option>French</option>
        </select>
      </div>
      <div class="content-library-filter-item">
        <label>{{ "lib.search" | transloco }}</label>
        <input type="text" placeholder="search" />
      </div>
    </div>
    <div class="content-library-filter-mobile">
      <lingomq-button (click)="showMobileFilter()">{{ "lib.filter" | transloco }}</lingomq-button>
      <div class="content-library-filter-mobile-item">
        <div class="content-library-filter-item">
          <label>{{ "lib.native" | transloco }}</label>
          <select>
            <option>Russian</option>
            <option>English</option>
            <option>German</option>
            <option>French</option>
          </select>
        </div>
        <div class="content-library-filter-item">
          <label>{{ "lib.source" | transloco }}</label>
          <select>
            <option>Russian</option>
            <option>English</option>
            <option>German</option>
            <option>French</option>
          </select>
        </div>
        <div class="content-library-filter-item">
          <label>{{ "lib.search" | transloco }}</label>
          <input type="text" placeholder="search" />
        </div>
      </div>
    </div>
    <div class="content-library-words-block">
      <div *ngFor="let wordInfo of wordInfos" class="content-library-words-alphabetic-component">
        <div class="content-library-words-alphabetic-component-header">
          <h1>{{ wordInfo.letter | uppercase }}</h1>
          <hr />
        </div>
        <div class="content-library-words-alphabetic-component-block">
          <div *ngFor="let word of wordInfo.wordInfos" class="content-library-word">
            <p>{{word.word}}</p>
            <i>{{word.transcription}}</i>
            <i>{{parseTranslationFromWordByLanguage(word, "russian")?.word}}</i>
          </div>
        </div>
      </div>
    </div>
    <div class="content-library-pagination-block">
      <div class="content-library-pagination">
        <lingomq-button (click)="prev()"><</lingomq-button>
        <lingomq-button (click)="next()">></lingomq-button>
      </div>
    </div>
  </div>
</div>
<app-auth-footer></app-auth-footer>
